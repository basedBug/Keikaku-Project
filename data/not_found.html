<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>404 Not Found</title>
    <style>
        body {
            font-family: 'Helvetica Neue', Arial, sans-serif;
            background-color: #f8f9fa;
            display: flex;
            flex-direction: column;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            margin: 0;
            color: #333;
            line-height: 1.5;
        }

        .container {
            text-align: center;
            max-width: 80vh;
            padding: 1rem;
        }

        .status {
            font-size: 6rem;
            font-weight: 700;
            color: #46525f;
            margin: 5vh 0 0% 0;
            line-height: 0.5;
        }

        img {
            max-width: 50vh;
            height: auto;
            border-radius: 4px;
            margin: 3% 0;
            box-shadow: 0 3px 10px rgba(0, 0, 0, 0.08);
            border: 1px solid rgba(0, 0, 0, 0.05);
        }

        .message {
            font-size: 2rem;
            color: #555;
            margin-bottom: 1vh;
        }

        .quote {
            font-style: italic;
            color: #666;
            margin-top: 1%;
            font-size: 1.6rem;
        }
    </style>
</head>

<body>
    <div class="container">
        <div class="status">404</div>

        <p class="message">Oops! page not found</p>

        <img src="bruh_moment-min.jpg" alt="Well isn't this a brum moment">

        <p class="quote">"Well isn't this a bruh moment..."</p>
    </div>
</body>

</html>
